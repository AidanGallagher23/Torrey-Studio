<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torrey Studio — Logo Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter",system-ui,sans-serif;background:#0a0a0c;color:#f4f1ea}
.head{padding:48px 6vw 24px}
.head h1{font-family:"Fraunces",serif;font-weight:400;font-size:2.2rem}
.head p{color:#9a978f;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px 6vw 60px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{border:1px solid rgba(244,241,234,.1);border-radius:18px;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:240px}
.card.light{background:#f4f1ea}
.card.dark{background:#0e0e12}
.card .tag{position:relative;align-self:flex-start;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9a978f}
.card.light .tag{color:#6b6860}
.card img{max-width:100%}
.row{display:flex;gap:36px;align-items:center;flex-wrap:wrap;justify-content:center}
.swatches{display:flex;gap:18px;padding:0 6vw 60px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:8px;font-size:12px;color:#9a978f}
.sw .chip{width:120px;height:64px;border-radius:10px;border:1px solid rgba(244,241,234,.1)}
.full{grid-column:1/-1}
</style>
</head>
<body>
<div class="head">
  <h1>Torrey Studio — Logo Kit</h1>
  <p>Full set: horizontal lockup, monogram, favicon. SVG, scalable, editable.</p>
</div>

<div class="grid">
  <div class="card dark full">
    <span class="tag">Horizontal lockup · dark</span>
    <img src="logo-horizontal.svg" alt="Torrey Studio logo" width="460" />
  </div>
  <div class="card light full">
    <span class="tag">Horizontal lockup · light</span>
    <img src="logo-horizontal-light.svg" alt="Torrey Studio logo light" width="460" />
  </div>

  <div class="card dark">
    <span class="tag">Monogram</span>
    <img src="monogram.svg" alt="Monogram" width="150" />
  </div>
  <div class="card light">
    <span class="tag">Monogram on light</span>
    <img src="monogram.svg" alt="Monogram" width="150" />
  </div>

  <div class="card dark">
    <span class="tag">Favicon · scale test</span>
    <div class="row">
      <img src="favicon.svg" alt="Favicon 64" width="64" />
      <img src="favicon.svg" alt="Favicon 32" width="32" />
      <img src="favicon.svg" alt="Favicon 16" width="16" />
    </div>
  </div>
  <div class="card light">
    <span class="tag">Favicon on light</span>
    <div class="row">
      <img src="favicon.svg" alt="Favicon 64" width="64" />
      <img src="favicon.svg" alt="Favicon 32" width="32" />
      <img src="favicon.svg" alt="Favicon 16" width="16" />
    </div>
  </div>
</div>

<div class="swatches">
  <div class="sw"><div class="chip" style="background:#0a0a0c"></div>Ink #0a0a0c</div>
  <div class="sw"><div class="chip" style="background:#f4f1ea"></div>Paper #f4f1ea</div>
  <div class="sw"><div class="chip" style="background:#d8b46a"></div>Gold #d8b46a</div>
  <div class="sw"><div class="chip" style="background:#e7cf9a"></div>Gold soft #e7cf9a</div>
</div>
</body>
</html>
